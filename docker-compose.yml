services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n

    ports:
      - "5678:5678"

    environment:
      - TZ=Africa/Casablanca

    volumes:
      - ./n8n_data:/home/node/.n8n

    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg

    ports:
      - "3002:3000"

    restart: unless-stopped